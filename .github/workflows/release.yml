name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Tag to build and release, e.g. v1.2.0
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-superseded:
    name: Cancel superseded release runs
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Cancel older active runs
        run: |
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --status in_progress \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId' |
          while read -r release_run_id; do
            if [[ "$release_run_id" != "$GITHUB_RUN_ID" ]]; then
              gh run cancel "$release_run_id" \
                --repo "$GITHUB_REPOSITORY"
            fi
          done

  test:
    name: Preflight test suite
    needs: cancel-superseded
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[secure,tray]"

      - name: Run tests
        run: python3 -B -m unittest discover -s tests

  windows:
    needs: test
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  macos:
    needs: test
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit

  linux:
    needs: test
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-24.04
    env:
      PRIDGE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download all release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p \
            "$GITHUB_WORKSPACE/build" \
            "$RUNNER_TEMP/release-artifacts"
          gh run download "$GITHUB_RUN_ID" \
            --pattern 'pridge-*' \
            --dir "$RUNNER_TEMP/release-artifacts"
          find "$RUNNER_TEMP/release-artifacts" \
            -type f \
            -exec cp {} "$GITHUB_WORKSPACE/build/" \;

      - name: Generate release notes and checksums
        run: |
          python3 scripts/generate_release_notes.py \
            --output-dir "$GITHUB_WORKSPACE/build" \
            --tag "$RELEASE_VERSION" \
            --markdown-output "$GITHUB_WORKSPACE/build/Pridge-Client-Release-Notes.md"
          python3 scripts/generate_checksums.py \
            --output-dir "$GITHUB_WORKSPACE/build" \
            --require-all

      - name: Validate final release filenames
        run: |
          cd "$GITHUB_WORKSPACE/build"
          test -f Pridge-Client-Native-Setup-x64.exe
          test -f Pridge-Client-Native-Windows-x64-Portable.zip
          test -f Pridge-Client-Native-macOS-arm64.dmg
          test -f Pridge-Client-Native-macOS-x86_64.dmg
          test -f Pridge-Client-PyInstaller-Setup-x64.exe
          test -f Pridge-Client-PyInstaller-Windows-x64-Portable.zip
          test -f Pridge-Client-PyInstaller-macOS-arm64.dmg
          test -f Pridge-Client-PyInstaller-macOS-x86_64.dmg
          test -f Pridge-Client-Native-Linux-x86_64-Ubuntu22.04+.tar.gz
          test -f Pridge-Client-PyInstaller-Linux-x86_64-Ubuntu22.04+.tar.gz
          test -f SHA256SUMS.txt
          test -f Pridge-Client-Release-Notes.txt

      - name: Upload complete release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pridge-Client-${{ env.RELEASE_VERSION }}
          path: |
            ${{ github.workspace }}/build/Pridge-Client-Native-Setup-x64.exe
            ${{ github.workspace }}/build/Pridge-Client-Native-Windows-x64-Portable.zip
            ${{ github.workspace }}/build/Pridge-Client-Native-macOS-arm64.dmg
            ${{ github.workspace }}/build/Pridge-Client-Native-macOS-x86_64.dmg
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-Setup-x64.exe
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-Windows-x64-Portable.zip
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-macOS-arm64.dmg
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-macOS-x86_64.dmg
            ${{ github.workspace }}/build/Pridge-Client-Native-Linux-x86_64-Ubuntu22.04+.tar.gz
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-Linux-x86_64-Ubuntu22.04+.tar.gz
            ${{ github.workspace }}/build/SHA256SUMS.txt
            ${{ github.workspace }}/build/Pridge-Client-Release-Notes.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Pridge Client ${{ env.RELEASE_VERSION }}
          body_path: ${{ github.workspace }}/build/Pridge-Client-Release-Notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/build/Pridge-Client-Native-Setup-x64.exe
            ${{ github.workspace }}/build/Pridge-Client-Native-Windows-x64-Portable.zip
            ${{ github.workspace }}/build/Pridge-Client-Native-macOS-arm64.dmg
            ${{ github.workspace }}/build/Pridge-Client-Native-macOS-x86_64.dmg
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-Setup-x64.exe
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-Windows-x64-Portable.zip
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-macOS-arm64.dmg
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-macOS-x86_64.dmg
            ${{ github.workspace }}/build/Pridge-Client-Native-Linux-x86_64-Ubuntu22.04+.tar.gz
            ${{ github.workspace }}/build/Pridge-Client-PyInstaller-Linux-x86_64-Ubuntu22.04+.tar.gz
            ${{ github.workspace }}/build/SHA256SUMS.txt
            ${{ github.workspace }}/build/Pridge-Client-Release-Notes.txt
